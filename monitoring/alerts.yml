groups:
  - name: dineops-application-alerts
    interval: 30s
    rules:
      - alert: DineopsBackendDown
        expr: up{job="dineops-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DineOps backend is down"
          description: "Prometheus cannot scrape dineops-backend for more than 2 minutes."

      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="dineops-backend",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="dineops-backend"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend 5xx error rate is high"
          description: "More than 5% of requests are returning 5xx for 10 minutes."

      - alert: HikariPoolSaturation
        expr: hikaricp_connections_active{job="dineops-backend"} / clamp_min(hikaricp_connections_max{job="dineops-backend"}, 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hikari connection pool saturation high"
          description: "Active DB connections are above 80% of max for 5 minutes."

      - alert: HikariPendingConnections
        expr: hikaricp_connections_pending{job="dineops-backend"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests waiting for DB connection"
          description: "Hikari has pending connection acquisition for over 5 minutes."
