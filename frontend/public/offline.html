<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <title>PlatterOps — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fafafa;
        color: #1f2937;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .icon { font-size: 3.5rem; }
      h1 { font-size: 1.25rem; font-weight: 700; }
      p { font-size: 0.875rem; color: #6b7280; max-width: 22rem; line-height: 1.6; }
      button {
        margin-top: 0.5rem;
        background: #f97316;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #ea6c0a; }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      PlatterOps needs a connection to sync orders and data.
      Check your internet and try again — your data is safe.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
