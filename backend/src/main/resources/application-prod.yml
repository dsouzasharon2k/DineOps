spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME:dineops-prod-hikari}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:10}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  flyway:
    baseline-on-migrate: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${SENTRY_RELEASE:dineops-backend-prod}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.2}
  send-default-pii: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  sms:
    provider: ${SMS_PROVIDER:mock}
    sender-id: ${SMS_SENDER_ID:DINEOP}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${EMAIL_FROM:no-reply@dineops.local}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-shared-secret: ${PAYMENT_WEBHOOK_SHARED_SECRET:}
    frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  digest:
    schedule-enabled: ${DIGEST_SCHEDULE_ENABLED:true}
    cron: ${DIGEST_CRON:0 30 23 * * *}
    fallback-recipients: ${DIGEST_FALLBACK_RECIPIENTS:}
  uptime:
    enabled: ${UPTIME_MONITOR_ENABLED:true}
    check-cron: ${UPTIME_CHECK_CRON:0 */5 * * * *}
    targets:
      backend-health-url: ${UPTIME_BACKEND_HEALTH_URL:https://api.example.com/actuator/health}
      frontend-url: ${UPTIME_FRONTEND_URL:https://app.example.com/}
    alerts:
      cooldown-minutes: ${UPTIME_ALERT_COOLDOWN_MINUTES:30}
      email-recipients: ${UPTIME_ALERT_EMAIL_RECIPIENTS:}
      whatsapp-recipients: ${UPTIME_ALERT_WHATSAPP_RECIPIENTS:}
      slack-webhook-url: ${UPTIME_ALERT_SLACK_WEBHOOK_URL:}
