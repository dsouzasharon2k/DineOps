spring:
  application:
    name: dineops-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dineops}
    username: ${DB_USERNAME:dineops}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME:dineops-hikari}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:15}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

  security:
    user:
      name: disabled
      password: disabled

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  address: 0.0.0.0
  port: 8080

management:
  metrics:
    enable:
      hikaricp: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
      roles: SUPER_ADMIN

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:dineops-backend-dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      smsGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  sms:
    provider: ${SMS_PROVIDER:mock}
    sender-id: ${SMS_SENDER_ID:DINEOP}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  email:
    provider: ${EMAIL_PROVIDER:mock}
    from: ${EMAIL_FROM:no-reply@dineops.local}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-shared-secret: ${PAYMENT_WEBHOOK_SHARED_SECRET:}
    frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL:http://localhost:5173}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
  digest:
    schedule-enabled: ${DIGEST_SCHEDULE_ENABLED:false}
    cron: ${DIGEST_CRON:0 30 23 * * *}
    fallback-recipients: ${DIGEST_FALLBACK_RECIPIENTS:}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  uptime:
    enabled: ${UPTIME_MONITOR_ENABLED:false}
    check-cron: ${UPTIME_CHECK_CRON:0 */5 * * * *}
    targets:
      backend-health-url: ${UPTIME_BACKEND_HEALTH_URL:http://localhost:8080/actuator/health}
      frontend-url: ${UPTIME_FRONTEND_URL:http://localhost:5173/}
    alerts:
      cooldown-minutes: ${UPTIME_ALERT_COOLDOWN_MINUTES:30}
      email-recipients: ${UPTIME_ALERT_EMAIL_RECIPIENTS:}
      whatsapp-recipients: ${UPTIME_ALERT_WHATSAPP_RECIPIENTS:}
      slack-webhook-url: ${UPTIME_ALERT_SLACK_WEBHOOK_URL:}
